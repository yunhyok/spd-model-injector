[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spd-model-injector"
version = "0.7.1"
description = "Desktop tool for injecting SPICE models into Cadence PowerSI SPD PartialCkt blocks."
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "openpyxl>=3.1"]

[project.scripts]
spd-model-injector = "spd_model_injector.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spd_model_injector = ["ui/app.ico", "ui/app.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
